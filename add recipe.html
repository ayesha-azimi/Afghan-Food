<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Recipe</title>
  <link rel="stylesheet" href="add recipe.css">
</head>
<body>
  <header>
    <div class="container"> 
        <h1>
            Afghan Recipe Book
        </h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="list.html">Recipe List</a></li>
                <li><a href="add recipe.html">Add Recipe</a></li>
            </ul>
        </nav>
    </div>
</header>

  <main>
    <h2>Add a New Recipe</h2>
    <form action="#" method="POST">
      <label for="name">Recipe Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="ingredients">Ingredients:</label>
      <textarea id="ingredients" name="ingredients" required></textarea>

      <label for="instructions">Cooking Instructions:</label>
      <textarea id="instructions" name="instructions" required></textarea>

      <label for="image">Image URL:</label>
      <input type="url" id="image" name="image" required>

      <label for="category">Category:</label>
      <select id="category" name="category" required>
        <option value="Rice Dishes">Rice Dishes</option>
        <option value="Stews">Stews</option>
        <option value="Desserts">Desserts</option>
        <option value="Breads">Breads</option>
        <option value="Vegetarian">Vegetarian</option>
      </select>

      <button type="submit">Add Recipe</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Afghan Recipe Book | Created by: Ayesha Azimi</p>
  </footer>
</body>
</html>
